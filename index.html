<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini VR Block Room V1</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#10141b;
  font-family:Arial,sans-serif;
}

#hud{
  position:fixed;
  z-index:10;
  top:12px;
  left:12px;
  color:white;
  background:#000b;
  padding:12px;
  border-radius:10px;
  line-height:1.4;
}

#vr{
  position:fixed;
  z-index:10;
  top:12px;
  right:12px;
  padding:12px 16px;
  border:0;
  border-radius:10px;
  font-weight:bold;
}

#msg{
  position:fixed;
  z-index:10;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  color:white;
  background:#000b;
  padding:8px 14px;
  border-radius:20px;
}
</style>
</head>

<body>

<div id="hud">
  <b>Mini VR Block Room V1</b><br>
  VR: put your small hand near a block<br>
  Hold GRIP to pick it up<br>
  Release GRIP to drop it
</div>

<button id="vr">ENTER VR</button>

<div id="msg">Ready</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import { VRButton } from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/VRButton.js";


/* =========================
   SCENE
========================= */

const scene = new THREE.Scene();

scene.background =
  new THREE.Color(0x151c27);


/* =========================
   CAMERA
========================= */

const camera =
  new THREE.PerspectiveCamera(
    70,
    innerWidth / innerHeight,
    0.05,
    60
  );

camera.position.set(
  0,
  1.65,
  4
);


/* =========================
   RENDERER
========================= */

const renderer =
  new THREE.WebGLRenderer({
    antialias:true
  });

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio || 1,
    2
  )
);

renderer.xr.enabled = true;

renderer.shadowMap.enabled = true;

document.body.appendChild(
  renderer.domElement
);


/* =========================
   VR BUTTON
========================= */

const realVR =
  VRButton.createButton(
    renderer
  );

realVR.style.display =
  "none";

document.body.appendChild(
  realVR
);

document.getElementById("vr").onclick =
  function(){
    realVR.click();
  };


/* =========================
   LIGHTING
========================= */

const hemi =
  new THREE.HemisphereLight(
    0xffffff,
    0x333333,
    2
  );

scene.add(hemi);


const sun =
  new THREE.DirectionalLight(
    0xffffff,
    3
  );

sun.position.set(
  2,
  6,
  3
);

sun.castShadow = true;

scene.add(sun);


/* =========================
   FLOOR
========================= */

const floor =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      8,
      0.2,
      8
    ),
    new THREE.MeshStandardMaterial({
      color:0x555e68,
      roughness:0.9
    })
  );

floor.position.y = -0.1;

floor.receiveShadow = true;

scene.add(floor);


/* =========================
   WALLS
========================= */

function makeWall(
  x,y,z,
  sx,sy,sz
){

  const wall =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        sx,sy,sz
      ),
      new THREE.MeshStandardMaterial({
        color:0x303844,
        roughness:0.8
      })
    );

  wall.position.set(
    x,y,z
  );

  wall.receiveShadow = true;

  scene.add(wall);
}

makeWall(
  0,2,-4,
  8,4,0.2
);

makeWall(
  -4,2,0,
  0.2,4,8
);

makeWall(
  4,2,0,
  0.2,4,8
);


/* =========================
   BLOCKS
========================= */

const blocks = [];

const colors = [
  0xe95f5f,
  0x5b9be8,
  0x63c777,
  0xe7b94f,
  0xb46be8,
  0x4fc7c7
];


function makeBlock(
  index,
  x,y,z
){

  const block =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        0.55,
        0.55,
        0.55
      ),
      new THREE.MeshStandardMaterial({
        color:
          colors[
            index % colors.length
          ],
        roughness:0.6
      })
    );

  block.position.set(
    x,y,z
  );

  block.castShadow = true;

  block.receiveShadow = true;

  block.userData.held = false;

  scene.add(block);

  blocks.push(block);
}


const positions = [
  [-1.5,0.275,-1.2],
  [-0.75,0.275,-1.2],
  [0,0.275,-1.2],
  [0.75,0.275,-1.2],
  [1.5,0.275,-1.2],
  [-0.75,0.825,-1.2],
  [0,0.825,-1.2]
];


positions.forEach(
  (p,i) => {
    makeBlock(
      i,
      p[0],
      p[1],
      p[2]
    );
  }
);


/* =========================
   SMALL HAND
========================= */

function makeSmallHand(){

  const hand =
    new THREE.Group();


  /*
    SMALL HAND
    This is intentionally
    much smaller than the
    previous version.
  */

  hand.scale.set(
    0.35,
    0.35,
    0.35
  );


  const skin =
    new THREE.MeshStandardMaterial({
      color:0xd69a78,
      roughness:0.8
    });


  /* Palm */

  const palm =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        0.22,
        0.14,
        0.25
      ),
      skin
    );

  hand.add(palm);


  /* Four fingers */

  for(
    let i=0;
    i<4;
    i++
  ){

    const finger =
      new THREE.Mesh(
        new THREE.CapsuleGeometry(
          0.025,
          0.12,
          4,
          8
        ),
        skin
      );

    finger.position.set(
      -0.075 + i * 0.05,
      0,
      -0.17
    );

    finger.rotation.x =
      Math.PI / 2;

    hand.add(finger);
  }


  /* Thumb */

  const thumb =
    new THREE.Mesh(
      new THREE.CapsuleGeometry(
        0.025,
        0.11,
        4,
        8
      ),
      skin
    );

  thumb.position.set(
    -0.12,
    -0.01,
    -0.06
  );

  thumb.rotation.z =
    -0.7;

  hand.add(thumb);


  return hand;
}


/* =========================
   CONTROLLERS
========================= */

const controllers = [];

let heldBlock = null;

let heldController = null;


for(
  let i=0;
  i<2;
  i++
){

  const controller =
    renderer.xr.getController(i);


  const hand =
    makeSmallHand();


  controller.add(hand);


  controller.userData.hand =
    hand;


  /*
    GRIP START
  */

  controller.addEventListener(
    "squeezestart",
    function(){

      if(heldBlock){
        return;
      }


      const handPosition =
        new THREE.Vector3()
          .setFromMatrixPosition(
            controller.matrixWorld
          );


      let closest = null;

      let distance = 0.65;


      for(
        const block of blocks
      ){

        if(block.userData.held){
          continue;
        }


        const d =
          handPosition.distanceTo(
            block.position
          );


        if(d < distance){

          closest = block;

          distance = d;
        }
      }


      if(!closest){

        document.getElementById(
          "msg"
        ).textContent =
          "Move your hand closer";

        return;
      }


      heldBlock = closest;

      heldController =
        controller;

      heldBlock.userData.held =
        true;


      document.getElementById(
        "msg"
      ).textContent =
        "GRABBED";
    }
  );


  /*
    GRIP RELEASE
  */

  controller.addEventListener(
    "squeezeend",
    function(){

      if(
        !heldBlock ||
        heldController !== controller
      ){
        return;
      }


      heldBlock.userData.held =
        false;


      heldBlock = null;

      heldController = null;


      document.getElementById(
        "msg"
      ).textContent =
        "DROPPED";
    }
  );


  scene.add(controller);

  controllers.push(controller);
}


/* =========================
   HELD BLOCK
========================= */

function updateHeldBlock(){

  if(
    !heldBlock ||
    !heldController
  ){
    return;
  }


  const position =
    new THREE.Vector3()
      .setFromMatrixPosition(
        heldController.matrixWorld
      );


  heldBlock.position.copy(
    position
  );
}


/* =========================
   SIMPLE GRAVITY
========================= */

const velocity =
  new THREE.Vector3();


const clock =
  new THREE.Clock();


function updatePhysics(){

  const dt =
    Math.min(
      clock.getDelta(),
      0.033
    );


  for(
    const block of blocks
  ){

    if(block.userData.held){
      continue;
    }


    /*
      Keep blocks on the floor
      for this first stable test.
    */

    if(
      block.position.y <
      0.275
    ){

      block.position.y =
        0.275;
    }
  }


  updateHeldBlock();
}


/* =========================
   ANIMATION
========================= */

function animate(){

  updatePhysics();


  renderer.render(
    scene,
    camera
  );
}


renderer.setAnimationLoop(
  animate
);


/* =========================
   RESIZE
========================= */

addEventListener(
  "resize",
  function(){

    camera.aspect =
      innerWidth /
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);


/* =========================
   DESKTOP CLICK TEST
========================= */

const raycaster =
  new THREE.Raycaster();

const mouse =
  new THREE.Vector2();


addEventListener(
  "pointerdown",
  function(event){

    if(renderer.xr.isPresenting){
      return;
    }


    mouse.x =
      event.clientX /
      innerWidth * 2 - 1;

    mouse.y =
      -(event.clientY /
      innerHeight) * 2 + 1;


    raycaster.setFromCamera(
      mouse,
      camera
    );


    const hit =
      raycaster.intersectObjects(
        blocks
      )[0];


    if(hit){

      heldBlock =
        hit.object;

      heldBlock.userData.held =
        true;

      document.getElementById(
        "msg"
      ).textContent =
        "GRABBED";
    }
  }
);


addEventListener(
  "pointerup",
  function(){

    if(
      !renderer.xr.isPresenting &&
      heldBlock
    ){

      heldBlock.userData.held =
        false;

      heldBlock = null;

      heldController = null;

      document.getElementById(
        "msg"
      ).textContent =
        "DROPPED";
    }
  }
);

</script>

</body>
</html>
