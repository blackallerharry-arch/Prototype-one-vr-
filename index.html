<body>

<div id="hud">
<b>Mini VR Block Room</b><br>
Mode: <span id="modeText">HAND</span><br>
Hand: grip near a block to grab.<br>
Pointer: trigger to grab, release to drop.
</div>

<button id="vr">ENTER VR</button>
<div id="msg">Choose a block</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import {VRButton} from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/VRButton.js";


/* =========================================================
   SCENE
========================================================= */

const scene=new THREE.Scene();

scene.background=
 new THREE.Color(0x151c27);

scene.fog=
 new THREE.Fog(
  0x151c27,
  8,
  20
);


const camera=
 new THREE.PerspectiveCamera(
  70,
  innerWidth/innerHeight,
  .05,
  60
 );

camera.position.set(
 0,
 1.65,
 4
 );


const renderer=
 new THREE.WebGLRenderer({
  antialias:true
 });

renderer.setSize(
 innerWidth,
 innerHeight
 );

renderer.setPixelRatio(
 Math.min(devicePixelRatio,2)
 );

renderer.xr.enabled=true;

renderer.shadowMap.enabled=true;

renderer.shadowMap.type=
 THREE.PCFSoftShadowMap;

document.body.appendChild(
 renderer.domElement
);


/* =========================================================
   VR BUTTON
========================================================= */

const realVR=
 VRButton.createButton(
  renderer
 );

realVR.style.display="none";

document.body.appendChild(
 realVR
 );

document.querySelector("#vr").onclick=
 ()=>{
  realVR.click();
 };


/* =========================================================
   LIGHTS
========================================================= */

scene.add(
 new THREE.HemisphereLight(
  0xbfd8ff,
  0x26303b,
  1.8
 )
 );


const sun=
 new THREE.DirectionalLight(
  0xffffff,
  3.2
 );

sun.position.set(
 2,
 6,
 3
 );

sun.castShadow=true;

sun.shadow.mapSize.set(
 1024,
 1024
 );

scene.add(sun);


/* =========================================================
   FLOOR
========================================================= */

const floor=
 new THREE.Mesh(
  new THREE.BoxGeometry(
   8,
   .2,
   8
  ),
  new THREE.MeshStandardMaterial({
   color:0x555e68,
   roughness:.9
  })
 );

floor.position.y=-.1;

floor.receiveShadow=true;

scene.add(floor);


/* =========================================================
   WALLS
========================================================= */

function makeWall(
 x,y,z,
 sx,sy,sz
){

 const wall=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    sx,
    sy,
    sz
   ),
   new THREE.MeshStandardMaterial({
    color:0x2d3540,
    roughness:.8
   })
  );

 wall.position.set(
  x,y,z
 );

 wall.receiveShadow=true;

 scene.add(wall);
}


makeWall(
 0,2,-4,
 8,4,.2
 );

makeWall(
 -4,2,0,
 .2,4,8
 );

makeWall(
 4,2,0,
 .2,4,8
 );


/* =========================================================
   BLOCKS
========================================================= */

const blocks=[];

const colors=[
 0xe95f5f,
 0x5b9be8,
 0x63c777,
 0xe7b94f,
 0xb46be8,
 0x4fc7c7
];

const BLOCK_SIZE=.55;

const HALF=.275;


function makeBlock(
 i,
 x,
 y,
 z
){

 const b=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    BLOCK_SIZE,
    BLOCK_SIZE,
    BLOCK_SIZE
   ),
   new THREE.MeshStandardMaterial({
    color:
     colors[
      i%colors.length
     ],
    roughness:.6,
    metalness:.05
   })
  );


 b.position.set(
  x,y,z
 );

 b.castShadow=true;

 b.receiveShadow=true;


 b.userData.vel=
  new THREE.Vector3();

 b.userData.held=false;


 scene.add(b);

 blocks.push(b);
}


[
 [-1.5,.28,-1.2],
 [-.75,.28,-1.2],
 [0,.28,-1.2],
 [.75,.28,-1.2],
 [1.5,.28,-1.2],
 [-.75,.83,-1.2],
 [0,.83,-1.2]
].forEach(
 (p,i)=>{
  makeBlock(
   i,
   p[0],
   p[1],
   p[2]
  );
 }
);


/* =========================================================
   MODE
========================================================= */

let mode="hand";

const modeText=
 document.querySelector(
  "#modeText"
 );


function setMode(
 newMode
){

 mode=newMode;

 modeText.textContent=
  mode==="hand"
   ? "HAND"
   : "POINTER";


 for(
  const c of controllers
 ){

  c.userData.pointer.visible=
   mode==="pointer" &&
   renderer.xr.isPresenting;

  c.userData.hand.visible=
   mode==="hand";
 }


 if(held){

  held.userData.held=false;

  held=null;

  heldController=null;
 }


 document.querySelector(
  "#msg"
 ).textContent=
  mode==="hand"
   ? "HAND MODE"
   : "POINTER MODE";
}


/* =========================================================
   POINTER
========================================================= */

function createPointer(){

 const material=
  new THREE.LineBasicMaterial({
   color:0x00ffff
  });

 const geometry=
  new THREE.BufferGeometry();

 geometry.setFromPoints([
  new THREE.Vector3(0,0,0),
  new THREE.Vector3(0,0,-5)
 ]);


 const line=
  new THREE.Line(
   geometry,
   material
  );

 line.visible=false;

 return line;
}


/* =========================================================
   HAND
========================================================= */

function createHand(){

 const hand=
  new THREE.Group();


 /* palm */

 const palm=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    .18,
    .13,
    .22
   ),
   new THREE.MeshStandardMaterial({
    color:0xd79b76,
    roughness:.8
   })
  );

 palm.position.set(
  0,
  0,
  -.02
 );

 hand.add(palm);


 /* fingers */

 const fingers=[];


 for(
  let i=0;
  i<4;
  i++
 ){

  const finger=
   new THREE.Mesh(
    new THREE.CapsuleGeometry(
     .018,
     .09,
     4,
     8
    ),
    new THREE.MeshStandardMaterial({
     color:0xe2aa84
    })
   );

  finger.position.set(
   -.06+i*.04,
   -.01,
   -.12
  );

  finger.rotation.x=
   Math.PI/2;

  hand.add(finger);

  fingers.push(finger);
 }


 /* thumb */

 const thumb=
  new THREE.Mesh(
   new THREE.CapsuleGeometry(
    .02,
    .08,
    4,
    8
   ),
   new THREE.MeshStandardMaterial({
    color:0xe2aa84
   })
  );

 thumb.position.set(
  -.10,
  -.015,
  -.055
 );

 thumb.rotation.z=
  -.7;

 hand.add(thumb);


 hand.userData.fingers=
  fingers;

 hand.userData.thumb=
  thumb;

 hand.userData.grabbing=false;


 return hand;
}


/* =========================================================
   HAND ANIMATION
========================================================= */

function animateHand(
 hand,
 grabbing,
 dt
){

 const fingers=
  hand.userData.fingers;

 const target=
  grabbing
   ? -0.9
   : 0;


 for(
  const finger of fingers
 ){

  finger.rotation.y=
   THREE.MathUtils.lerp(
    finger.rotation.y,
    target,
    Math.min(dt*12,1)
   );
 }


 const thumb=
  hand.userData.thumb;

 thumb.rotation.z=
  THREE.MathUtils.lerp(
   thumb.rotation.z,
   grabbing
    ? -.2
    : -.7,
   Math.min(dt*12,1)
  );


 hand.userData.grabbing=
  grabbing;
}


/* =========================================================
   CONTROLLERS
========================================================= */

const controllers=[];

let held=null;

let heldController=null;

let holdDistance=1.2;


const previousPositions=
 new Map();

const currentVelocities=
 new Map();


for(
 let i=0;
 i<2;
 i++
 ){

 const controller=
  renderer.xr.getController(i);


 controller.userData.index=
  i;


 const pointer=
  createPointer();

 controller.add(pointer);

 controller.userData.pointer=
  pointer;


 const hand=
  createHand();

 controller.add(hand);

 controller.userData.hand=
  hand;


 /* trigger */

 controller.addEventListener(
  "selectstart",
  ()=>{
   if(mode==="pointer"){
    pointerGrab(controller);
   }
  }
 );


 controller.addEventListener(
  "selectend",
  ()=>{
   if(mode==="pointer"){
    pointerDrop(controller);
   }
  }
 );


 /* grip */

 controller.addEventListener(
  "squeezestart",
  ()=>{
   if(mode==="hand"){
    handGrab(controller);
   }
  }
 );


 controller.addEventListener(
  "squeezeend",
  ()=>{
   if(mode==="hand"){
    handThrow(controller);
   }
  }
 );


 scene.add(controller);

 controllers.push(
  controller
 );
}


/* =========================================================
   CONTROLLER POSITION
========================================================= */

function controllerPosition(c){

 return new THREE.Vector3()
  .setFromMatrixPosition(
   c.matrixWorld
  );
}


/* =========================================================
   CONTROLLER DIRECTION
========================================================= */

function controllerDirection(c){

 const q=
  c.getWorldQuaternion(
   new THREE.Quaternion()
  );

 return new THREE.Vector3(
  0,
  0,
  -1
 ).applyQuaternion(q);
}


/* =========================================================
   HAND GRAB
========================================================= */

function handGrab(c){

 if(held)return;


 const handPos=
  controllerPosition(c);


 let closest=null;

 let closestDistance=.55;


 for(
  const b of blocks
 ){

  if(b.userData.held)
   continue;


  const distance=
   handPos.distanceTo(
    b.position
   );


  if(
   distance<
   closestDistance
  ){

   closest=b;

   closestDistance=
    distance;
  }
 }


 if(!closest){

  document.querySelector(
   "#msg"
  ).textContent=
   "Put your hand near a block";

  return;
 }


 held=closest;

 heldController=c;

 held.userData.held=true;


 holdDistance=
  Math.max(
   .35,
   closestDistance
  );


 animateHand(
  c.userData.hand,
  true,
  .05
 );


 document.querySelector(
  "#msg"
 ).textContent=
  "GRABBED";
}


/* =========================================================
   HAND THROW
========================================================= */

function handThrow(c){

 if(!held)return;

 if(
  heldController!==c
 )return;


 const velocity=
  currentVelocities.get(c)
  ||
  new THREE.Vector3();


 held.userData.held=false;


 held.userData.vel
  .copy(velocity)
  .multiplyScalar(2.2);


 held=null;

 heldController=null;


 animateHand(
  c.userData.hand,
  false,
  .08
 );


 document.querySelector(
  "#msg"
 ).textContent=
  "THROWN";
}


/* =========================================================
   POINTER GRAB
========================================================= */

const raycaster=
 new THREE.Raycaster();


function pointerGrab(c){

 if(held)return;


 const origin=
  controllerPosition(c);

 const direction=
  controllerDirection(c);


 raycaster.set(
  origin,
  direction
 );


 const hit=
  raycaster.intersectObjects(
   blocks,
   false
  )[0];


 if(
  !hit ||
  hit.distance>5
 ){

  document.querySelector(
   "#msg"
  ).textContent=
   "Point at a block";

  return;
 }


 held=hit.object;

 heldController=c;

 held.userData.held=true;


 holdDistance=
  THREE.MathUtils.clamp(
   hit.distance,
   .7,
   4
  );


 document.querySelector(
  "#msg"
 ).textContent=
  "HOLDING";
}


/* =========================================================
   POINTER DROP
========================================================= */

function pointerDrop(c){

 if(!held)return;

 if(
  heldController!==c
 )return;


 /*
    Pointer mode NEVER throws.
 */

 held.userData.held=false;

 held.userData.vel.set(
  0,
  0,
  0
 );


 held=null;

 heldController=null;


 document.querySelector(
  "#msg"
 ).textContent=
  "DROPPED";
}


/* =========================================================
   POINTER UPDATE
========================================================= */

function updatePointers(){

 for(
  const c of controllers
 ){

  const pointer=
   c.userData.pointer;


  if(
   mode!=="pointer" ||
   !renderer.xr.isPresenting
  ){

   pointer.visible=false;

   continue;
  }


  pointer.visible=true;


  const origin=
   controllerPosition(c);

  const direction=
   controllerDirection(c);


  raycaster.set(
   origin,
   direction
  );


  const hit=
   raycaster.intersectObjects(
    blocks,
    false
   )[0];


  let length=5;


  if(hit){

   length=
    Math.min(
     hit.distance,
     5
    );

   pointer.material.color.setHex(
    0x00ff66
   );

  }else{

   pointer.material.color.setHex(
    0x00ffff
   );
  }


  pointer.geometry.setFromPoints([
   new THREE.Vector3(0,0,0),
   new THREE.Vector3(
    0,
    0,
    -length
   )
  ]);
 }
}


/* =========================================================
   JOYSTICK
========================================================= */

function updateJoystick(){

 if(
  mode!=="pointer" ||
  !held ||
  !heldController
 )
  return;


 const session=
  renderer.xr.getSession();


 if(!session)
  return;


 let source=null;


 const hand=
  heldController.userData.index===0
   ? "left"
   : "right";


 for(
  const s of session.inputSources
 ){

  if(
   s.handedness===hand &&
   s.gamepad
  ){

   source=s;

   break;
  }
 }


 if(
  !source ||
  !source.gamepad
 )
  return;


 const axes=
  source.gamepad.axes;


 if(
  !axes ||
  axes.length<2
 )
  return;


 let y;


 if(axes.length>=4){

  y=axes[3];

 }else{

  y=axes[1];
 }


 if(
  Math.abs(y)>.12
 ){

  holdDistance+=
   y*.035;


  holdDistance=
   THREE.MathUtils.clamp(
    holdDistance,
    .7,
    4
   );
 }
}


/* =========================================================
   MOVE HELD BLOCK
========================================================= */

function updateHeld(){

 if(
  !held ||
  !heldController
 )
  return;


 if(mode==="pointer"){

  const origin=
   controllerPosition(
    heldController
   );

  const direction=
   controllerDirection(
    heldController
   );


  held.position.copy(
   origin
  );


  held.position.addScaledVector(
   direction,
   holdDistance
  );


  held.userData.vel.set(
   0,
   0,
   0
  );

 }else{

  const handPos=
   controllerPosition(
    heldController
   );


  held.position.copy(
   handPos
  );


  held.userData.vel.set(
   0,
   0,
   0
  );
 }
}


/* =========================================================
   HAND VELOCITY
========================================================= */

function updateHandVelocity(dt){

 if(
  !renderer.xr.isPresenting
 )
  return;


 for(
  const c of controllers
 ){

  const position=
   controllerPosition(c);


  const previous=
   previousPositions.get(c);


  if(previous){

   const velocity=
    position.clone()
     .sub(previous)
     .divideScalar(
      Math.max(
       dt,
       .001
      )
     );


   currentVelocities.set(
    c,
    velocity
   );
  }


  previousPositions.set(
   c,
   position
  );
 }
}


/* =========================================================
   BLOCK COLLISIONS
========================================================= */

function blockCollisions(){

 for(
  let i=0;
  i<blocks.length;
  i++
 ){

  const a=blocks[i];

  if(a.userData.held)
   continue;


  for(
   let j=i+1;
   j<blocks.length;
   j++
  ){

   const b=blocks[j];

   if(b.userData.held)
    continue;


   const dx=
    b.position.x-
    a.position.x;

   const dy=
    b.position.y-
    a.position.y;

   const dz=
    b.position.z-
    a.position.z;


   const overlapX=
    BLOCK_SIZE-
    Math.abs(dx);

   const overlapY=
    BLOCK_SIZE-
    Math.abs(dy);

   const overlapZ=
    BLOCK_SIZE-
    Math.abs(dz);


   if(
    overlapX>0 &&
    overlapY>0 &&
    overlapZ>0
   ){

    if(
     overlapX<=overlapY &&
     overlapX<=overlapZ
    ){

     const push=
      overlapX/2;

     const sign=
      dx>=0
       ? 1
       : -1;


     a.position.x-=
      push*sign;

     b.position.x+=
      push*sign;


     const temp=
      a.userData.vel.x;

     a.userData.vel.x=
      b.userData.vel.x*.5;

     b.userData.vel.x=
      temp*.5;

    }else if(
     overlapY<=overlapX &&
     overlapY<=overlapZ
    ){

     const push=
      overlapY/2;

     const sign=
      dy>=0
       ? 1
       : -1;


     a.position.y-=
      push*sign;

     b.position.y+=
      push*sign;


     const temp=
      a.userData.vel.y;

     a.userData.vel.y=
      b.userData.vel.y*.5;

     b.userData.vel.y=
      temp*.5;

    }else{

     const push=
      overlapZ/2;

     const sign=
      dz>=0
       ? 1
       : -1;


     a.position.z-=
      push*sign;

     b.position.z+=
      push*sign;


     const temp=
      a.userData.vel.z;

     a.userData.vel.z=
      b.userData.vel.z*.5;

     b.userData.vel.z=
      temp*.5;
    }
   }
  }
 }
}


/* =========================================================
   PHYSICS
========================================================= */

function updatePhysics(dt){

 for(
  const b of blocks
 ){

  if(b.userData.held)
   continue;


  const velocity=
   b.userData.vel;


  velocity.y-=
   7*dt;


  b.position.addScaledVector(
   velocity,
   dt
  );


  if(
   b.position.y<
   HALF
  ){

   b.position.y=
    HALF;

   if(
    velocity.y<0
   ){

    velocity.y*=
     -.25;
   }


   velocity.x*=.92;

   velocity.z*=.92;
  }


  if(
   b.position.x<
   -3.7
  ){

   b.position.x=
    -3.7;

   velocity.x*=
    -.4;
  }


  if(
   b.position.x>
   3.7
  ){

   b.position.x=
    3.7;

   velocity.x*=
    -.4;
  }


  if(
   b.position.z<
   -3.7
  ){

   b.position.z=
    -3.7;

   velocity.z*=
    -.4;
  }


  if(
   b.position.z>
   3.7
  ){

   b.position.z=
    3.7;

   velocity.z*=
    -.4;
  }
 }


 blockCollisions();
}

const menu=

menu.visible=false;

scene.add(menu);


const panel=

/* =========================================================
   TEXT
========================================================= */

function makeText(
 text,
 size
){

 const canvas=
  document.createElement(
   "canvas"
  );

 canvas.width=512;

 canvas.height=128;


 const ctx=
  canvas.getContext(
   "2d"
  );


 ctx.clearRect(
  0,
  0,
  512,
  128
 );


 ctx.fillStyle=
  "#ffffff";


 ctx.font=
  `bold ${size}px Arial`;


 ctx.textAlign=
  "center";


 ctx.textBaseline=
  "middle";


 ctx.fillText(
  text,
  256,
  64
 );


 const texture=
  new THREE.CanvasTexture(
   canvas
  );


 const material=
  new THREE.MeshBasicMaterial({
   map:texture,
   transparent:true
  });


 return new THREE.Mesh(
  new THREE.PlaneGeometry(
   1.2,
   .25
  ),
  material
 );
}

 makeText(

 );


title.position.set(

 .34,
 -.04
 );

const handButton=
 makeText(

 );

 0,
 .08,

 );

 );

 );

/* =========================================================

const handHit=
 new THREE.Mesh(

  ),

  })

handHit.position.set(

handHit.userData.action=

menu.add(handHit);


const pointerHit=
 new THREE.Mesh(
  new THREE.PlaneGeometry(
   1.2,
   .22
  ),
  new THREE.MeshBasicMaterial({
   tra
