<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mini VR Block Room V6</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#10141b;
  font-family:system-ui,Arial,sans-serif;
}

#hud{
  position:fixed;
  z-index:10;
  left:12px;
  top:12px;
  color:white;
  background:#000b;
  padding:12px;
  border-radius:12px;
  line-height:1.4;
}

#vr{
  position:fixed;
  z-index:10;
  right:12px;
  top:12px;
  border:0;
  border-radius:10px;
  padding:12px 16px;
  font-weight:700;
}

#modeButton{
  position:fixed;
  z-index:10;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  border:0;
  border-radius:10px;
  padding:12px 18px;
  font-weight:700;
}

#msg{
  position:fixed;
  z-index:10;
  left:50%;
  bottom:70px;
  transform:translateX(-50%);
  color:white;
  background:#000b;
  padding:8px 14px;
  border-radius:20px;
}
</style>
</head>

<body>

<div id="hud">
  <b>Mini VR Block Room</b><br>
  Mode: <span id="modeText">HAND</span><br>
  HAND: grip near a block<br>
  POINTER: trigger to grab
</div>

<button id="vr">ENTER VR</button>
<button id="modeButton">SWITCH TO POINTER</button>
<div id="msg">Ready</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import { VRButton } from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/VRButton.js";


/* =====================================================
   SCENE
===================================================== */

const scene = new THREE.Scene();

scene.background =
  new THREE.Color(0x151c27);

scene.fog =
  new THREE.Fog(
    0x151c27,
    8,
    20
  );


const camera =
  new THREE.PerspectiveCamera(
    70,
    innerWidth / innerHeight,
    0.05,
    60
  );

camera.position.set(
  0,
  1.65,
  4
);


/* =====================================================
   RENDERER
===================================================== */

const renderer =
  new THREE.WebGLRenderer({
    antialias:true
  });

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio || 1,
    2
  )
);

renderer.xr.enabled = true;

renderer.shadowMap.enabled = true;

document.body.appendChild(
  renderer.domElement
);


/* =====================================================
   VR BUTTON
===================================================== */

const vrButton =
  VRButton.createButton(
    renderer
  );

vrButton.style.display = "none";

document.body.appendChild(
  vrButton
);

document.getElementById("vr").onclick =
  function(){
    vrButton.click();
  };


/* =====================================================
   LIGHTING
===================================================== */

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x333333,
    2
  )
);


const sun =
  new THREE.DirectionalLight(
    0xffffff,
    3
  );

sun.position.set(
  3,
  6,
  3
);

sun.castShadow = true;

scene.add(sun);


/* =====================================================
   FLOOR
===================================================== */

const floor =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      8,
      0.2,
      8
    ),
    new THREE.MeshStandardMaterial({
      color:0x555e68,
      roughness:0.9
    })
  );

floor.position.y = -0.1;

floor.receiveShadow = true;

scene.add(floor);


/* =====================================================
   WALLS
===================================================== */

function createWall(
  x,
  y,
  z,
  sx,
  sy,
  sz
){

  const wall =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        sx,
        sy,
        sz
      ),
      new THREE.MeshStandardMaterial({
        color:0x303844,
        roughness:0.8
      })
    );

  wall.position.set(
    x,
    y,
    z
  );

  wall.receiveShadow = true;

  scene.add(wall);
}


createWall(
  0,2,-4,
  8,4,0.2
);

createWall(
  -4,2,0,
  0.2,4,8
);

createWall(
  4,2,0,
  0.2,4,8
);


/* =====================================================
   BLOCKS
===================================================== */

const blocks = [];

const colours = [
  0xe95f5f,
  0x5b9be8,
  0x63c777,
  0xe7b94f,
  0xb46be8,
  0x4fc7c7
];

const BLOCK_SIZE = 0.55;

const HALF_BLOCK =
  BLOCK_SIZE / 2;


function createBlock(
  index,
  x,
  y,
  z
){

  const block =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        BLOCK_SIZE,
        BLOCK_SIZE,
        BLOCK_SIZE
      ),
      new THREE.MeshStandardMaterial({
        color:
          colours[
            index % colours.length
          ],
        roughness:0.6
      })
    );

  block.position.set(
    x,
    y,
    z
  );

  block.castShadow = true;

  block.receiveShadow = true;

  block.userData.velocity =
    new THREE.Vector3();

  block.userData.held =
    false;

  scene.add(block);

  blocks.push(block);
}


const blockPositions = [

  [-1.5,0.275,-1.2],
  [-0.75,0.275,-1.2],
  [0,0.275,-1.2],
  [0.75,0.275,-1.2],
  [1.5,0.275,-1.2],

  [-0.75,0.825,-1.2],
  [0,0.825,-1.2]

];


blockPositions.forEach(
  function(position,index){

    createBlock(
      index,
      position[0],
      position[1],
      position[2]
    );

  }
);


/* =====================================================
   MODE
===================================================== */

let mode = "hand";

const modeText =
  document.getElementById(
    "modeText"
  );

const modeButton =
  document.getElementById(
    "modeButton"
  );


function setMode(newMode){

  mode = newMode;

  modeText.textContent =
    mode === "hand"
      ? "HAND"
      : "POINTER";


  modeButton.textContent =
    mode === "hand"
      ? "SWITCH TO POINTER"
      : "SWITCH TO HAND";


  if(heldBlock){

    heldBlock.userData.held =
      false;

    heldBlock = null;

    heldController = null;
  }


  for(
    const controller of controllers
  ){

    controller.userData.pointer.visible =
      mode === "pointer";

    controller.userData.hand.visible =
      mode === "hand";
  }


  showMessage(
    mode === "hand"
      ? "HAND MODE"
      : "POINTER MODE"
  );
}


modeButton.onclick =
  function(){

    if(mode === "hand"){
      setMode("pointer");
    }else{
      setMode("hand");
    }

  };


/* =====================================================
   CONTROLLERS
===================================================== */

const controllers = [];

let heldBlock = null;

let heldController = null;

let holdDistance = 1.2;


/* =====================================================
   RAYCASTER
===================================================== */

const raycaster =
  new THREE.Raycaster();


/* =====================================================
   POINTER
===================================================== */

function createPointer(){

  const geometry =
    new THREE.BufferGeometry();

  geometry.setFromPoints([
    new THREE.Vector3(0,0,0),
    new THREE.Vector3(0,0,-5)
  ]);


  const material =
    new THREE.LineBasicMaterial({
      color:0x00ffff,
      linewidth:2
    });


  const pointer =
    new THREE.Line(
      geometry,
      material
    );


  pointer.visible = false;

  return pointer;
}


/* =====================================================
   SMALL HAND
===================================================== */

function createHand(){

  const hand =
    new THREE.Group();


  /*
    Everything is scaled to 60%
    so the hand is much smaller.
  */

  hand.scale.set(
    0.6,
    0.6,
    0.6
  );


  const skin =
    new THREE.MeshStandardMaterial({
      color:0xd69a78,
      roughness:0.8
    });


  const palm =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        0.18,
        0.14,
        0.22
      ),
      skin
    );

  palm.position.z = -0.02;

  hand.add(palm);


  const fingers = [];


  for(
    let i=0;
    i<4;
    i++
  ){

    const finger =
      new THREE.Mesh(
        new THREE.CapsuleGeometry(
          0.018,
          0.09,
          4,
          8
        ),
        skin
      );


    finger.position.set(
      -0.06 + i * 0.04,
      0,
      -0.14
    );


    finger.rotation.x =
      Math.PI / 2;


    hand.add(finger);

    fingers.push(finger);
  }


  const thumb =
    new THREE.Mesh(
      new THREE.CapsuleGeometry(
        0.02,
        0.08,
        4,
        8
      ),
      skin
    );


  thumb.position.set(
    -0.1,
    -0.01,
    -0.05
  );


  thumb.rotation.z =
    -0.7;


  hand.add(thumb);


  hand.userData.fingers =
    fingers;

  hand.userData.thumb =
    thumb;


  return hand;
}


/* =====================================================
   HAND ANIMATION
===================================================== */

function setHandGrab(
  hand,
  grabbing
){

  if(!hand){
    return;
  }


  for(
    const finger of
    hand.userData.fingers
  ){

    finger.rotation.y =
      grabbing
        ? -0.9
        : 0;
  }


  hand.userData.thumb.rotation.z =
    grabbing
      ? -0.2
      : -0.7;
}


/* =====================================================
   CREATE CONTROLLERS
===================================================== */

for(
  let i=0;
  i<2;
  i++
){

  const controller =
    renderer.xr.getController(i);


  controller.userData.index =
    i;


  const pointer =
    createPointer();


  controller.add(
    pointer
  );


  controller.userData.pointer =
    pointer;


  const hand =
    createHand();


  controller.add(
    hand
  );


  controller.userData.hand =
    hand;


  /*
    TRIGGER
  */

  controller.addEventListener(
    "selectstart",
    function(){

      try{

        if(mode === "pointer"){

          pointerGrab(
            controller
          );

        }

      }catch(error){

        console.error(
          "Pointer trigger error:",
          error
        );

        showMessage(
          "Pointer input error"
        );
      }

    }
  );


  controller.addEventListener(
    "selectend",
    function(){

      try{

        if(mode === "pointer"){

          pointerDrop(
            controller
          );

        }

      }catch(error){

        console.error(
          "Pointer release error:",
          error
        );

        if(heldBlock){

          heldBlock.userData.held =
            false;

          heldBlock = null;

          heldController = null;
        }

      }

    }
  );


  /*
    GRIP
  */

  controller.addEventListener(
    "squeezestart",
    function(){

      try{

        if(mode === "hand"){

          handGrab(
            controller
          );

        }

      }catch(error){

        console.error(
          "Hand grab error:",
          error
        );
      }

    }
  );


  controller.addEventListener(
    "squeezeend",
    function(){

      try{

        if(mode === "hand"){

          handThrow(
            controller
          );

        }

      }catch(error){

        console.error(
          "Hand throw error:",
          error
        );

      }

    }
  );


  scene.add(
    controller
  );


  controllers.push(
    controller
  );
}


/* =====================================================
   CONTROLLER POSITION
===================================================== */

function getControllerPosition(
  controller
){

  return new THREE.Vector3()
    .setFromMatrixPosition(
      controller.matrixWorld
    );
}


/* =====================================================
   CONTROLLER DIRECTION
===================================================== */

function getControllerDirection(
  controller
){

  const quaternion =
    controller.getWorldQuaternion(
      new THREE.Quaternion()
    );


  return new THREE.Vector3(
    0,
    0,
    -1
  ).applyQuaternion(
    quaternion
  );
}


/* =====================================================
   HAND GRAB
===================================================== */

function handGrab(
  controller
){

  if(heldBlock){
    return;
  }


  const handPosition =
    getControllerPosition(
      controller
    );


  let closestBlock = null;

  let closestDistance = 0.6;


  for(
    const block of blocks
  ){

    if(block.userData.held){
      continue;
    }


    const distance =
      handPosition.distanceTo(
        block.position
      );


    if(
      distance <
      closestDistance
    ){

      closestBlock =
        block;

      closestDistance =
        distance;
    }

  }


  if(!closestBlock){

    showMessage(
      "Move your hand closer"
    );

    return;
  }


  heldBlock =
    closestBlock;

  heldController =
    controller;


  heldBlock.userData.held =
    true;


  setHandGrab(
    controller.userData.hand,
    true
  );


  showMessage(
    "GRABBED"
  );
}


/* =====================================================
   CONTROLLER VELOCITY
===================================================== */

const previousPositions =
  new Map();

const controllerVelocities =
  new Map();


function updateControllerVelocity(
  deltaTime
){

  for(
    const controller of
    controllers
  ){

    const current =
      getControllerPosition(
        controller
      );


    const previous =
      previousPositions.get(
        controller
      );


    if(previous){

      const velocity =
        current
          .clone()
          .sub(previous)
          .divideScalar(
            Math.max(
              deltaTime,
              0.001
            )
          );


      controllerVelocities.set(
        controller,
        velocity
      );
    }


    previousPositions.set(
      controller,
      current
    );
  }
}


/* =====================================================
   HAND THROW
===================================================== */

function handThrow(
  controller
){

  if(
    !heldBlock ||
    heldController !== controller
  ){

    return;
  }


  const velocity =
    controllerVelocities.get(
      controller
    );


  heldBlock.userData.held =
    false;


  if(velocity){

    heldBlock.userData.velocity
      .copy(velocity)
      .multiplyScalar(2.2);

  }else{

    heldBlock.userData.velocity.set(
      0,
      0,
      0
    );

  }


  heldBlock = null;

  heldController = null;


  setHandGrab(
    controller.userData.hand,
    false
  );


  showMessage(
    "THROWN"
  );
}


/* =====================================================
   POINTER GRAB
===================================================== */

function pointerGrab(
  controller
){

  if(heldBlock){
    return;
  }


  const origin =
    getControllerPosition(
      controller
    );


  const direction =
    getControllerDirection(
      controller
    );


  raycaster.set(
    origin,
    direction
  );


  const intersections =
    raycaster.intersectObjects(
      blocks,
      false
    );


  if(
    intersections.length === 0
  ){

    showMessage(
      "Point at a block"
    );

    return;
  }


  const hit =
    intersections[0];


  if(
    hit.distance > 5
  ){

    showMessage(
      "Too far away"
    );

    return;
  }


  heldBlock =
    hit.object;


  heldController =
    controller;


  heldBlock.userData.held =
    true;


  holdDistance =
    THREE.MathUtils.clamp(
      hit.distance,
      0.7,
      4
    );


  showMessage(
    "HOLDING"
  );
}


/* =====================================================
   POINTER DROP
===================================================== */

function pointerDrop(
  controller
){

  if(
    !heldBlock ||
    heldController !== controller
  ){

    return;
  }


  /*
    IMPORTANT:
    Pointer mode DOES NOT THROW.
  */

  heldBlock.userData.held =
    false;


  heldBlock.userData.velocity.set(
    0,
    0,
    0
  );


  heldBlock = null;

  heldController = null;


  showMessage(
    "DROPPED"
  );
}


/* =====================================================
   UPDATE POINTER
===================================================== */

function updatePointers(){

  for(
    const controller of
    controllers
  ){

    const pointer =
      controller.userData.pointer;


    pointer.visible =
      mode === "pointer" &&
      renderer.xr.isPresenting;


    if(!pointer.visible){
      continue;
    }


    const origin =
      getControllerPosition(
        controller
      );


    const direction =
      getControllerDirection(
        controller
      );


    raycaster.set(
      origin,
      direction
    );


    const intersections =
      raycaster.intersectObjects(
        blocks,
        false
      );


    let length = 5;


    if(
      intersections.length > 0
    ){

      const hit =
        intersections[0];


      length =
        Math.min(
          hit.distance,
          5
        );


      pointer.material.color.setHex(
        0x00ff66
      );

    }else{

      pointer.material.color.setHex(
        0x00ffff
      );
    }


    pointer.geometry.setFromPoints([
      new THREE.Vector3(0,0,0),
      new THREE.Vector3(
        0,
        0,
        -length
      )
    ]);
  }
}


/* =====================================================
   JOYSTICK
===================================================== */

function updateJoystick(){

  if(
    mode !== "pointer" ||
    !heldBlock ||
    !heldController
  ){

    return;
  }


  const session =
    renderer.xr.getSession();


  if(!session){
    return;
  }


  const wantedHand =
    heldController.userData.index === 0
      ? "left"
      : "right";


  let source = null;


  for(
    const input of
    session.inputSources
  ){

    if(
      input.handedness ===
        wantedHand &&
      input.gamepad
    ){

      source = input;

      break;
    }
  }


  if(!source){
    return;
  }


  const axes =
    source.gamepad.axes;


  if(
    !axes ||
    axes.length < 2
  ){

    return;
  }


  /*
    Quest controllers normally expose
    the thumbstick through these axes.
  */

  const y =
    axes.length >= 4
      ? axes[3]
      : axes[1];


  if(
    Math.abs(y) > 0.12
  ){

    holdDistance +=
      y * 0.035;


    holdDistance =
      THREE.MathUtils.clamp(
        holdDistance,
        0.7,
        4
      );
  }
}


/* =====================================================
   MOVE HELD BLOCK
===================================================== */

function updateHeldBlock(){

  if(
    !heldBlock ||
    !heldController
  ){

    return;
  }


  const origin =
    getControllerPosition(
      heldController
    );


  if(
    mode === "pointer"
  ){

    const direction =
      getControllerDirection(
        heldController
      );


    heldBlock.position.copy(
      origin
    );


    heldBlock.position.addScaledVector(
      direction,
      holdDistance
    );

  }else{

    /*
      Hand mode:
      block stays in the hand.
    */

    heldBlock.position.copy(
      origin
    );
  }


  heldBlock.userData.velocity.set(
    0,
    0,
    0
  );
}


/* =====================================================
   PHYSICS
===================================================== */

function updatePhysics(
  deltaTime
){

  for(
    const block of blocks
  ){

    if(block.userData.held){
      continue;
    }


    const velocity =
      block.userData.velocity;


    velocity.y -=
      7 * deltaTime;


    block.position.addScaledVector(
      velocity,
      deltaTime
    );


    /*
      Floor
    */

    if(
      block.position.y <
      HALF_BLOCK
    ){

      block.position.y =
        HALF_BLOCK;


      if(
        velocity.y < 0
      ){

        velocity.y *=
          -0.25;
      }


      velocity.x *=
        0.92;

      velocity.z *=
        0.92;
    }


    /*
      Walls
    */

    if(
      block.position.x <
      -3.7
    ){

      block.position.x =
        -3.7;

      velocity.x *=
        -0.4;
    }


    if(
      block.position.x >
      3.7
    ){

      block.position.x =
        3.7;

      velocity.x *=
        -0.4;
    }


    if(
      block.position.z <
      -3.7
    ){

      block.position.z =
        -3.7;
