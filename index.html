<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini VR Block Room V5</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#11151c;
  font-family:Arial,sans-serif;
}

#hud{
  position:fixed;
  top:12px;
  left:12px;
  z-index:10;
  color:white;
  background:#000b;
  padding:12px;
  border-radius:12px;
  line-height:1.4;
}

#vr{
  position:fixed;
  top:12px;
  right:12px;
  z-index:10;
  padding:12px 18px;
  border:0;
  border-radius:10px;
  font-weight:bold;
}

#mode{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  padding:12px 18px;
  border:0;
  border-radius:10px;
  font-weight:bold;
}

#msg{
  position:fixed;
  bottom:70px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  color:white;
  background:#000b;
  padding:8px 14px;
  border-radius:20px;
}
</style>
</head>

<body>

<div id="hud">
<b>Mini VR Block Room</b><br>
Mode: <span id="modeText">HAND</span><br>
HAND: grip near a block<br>
POINTER: trigger to grab
</div>

<button id="vr">ENTER VR</button>
<button id="mode">SWITCH TO POINTER</button>
<div id="msg">Ready</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import { VRButton } from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/VRButton.js";


/* =========================
   SCENE
========================= */

const scene = new THREE.Scene();

scene.background =
  new THREE.Color(0x151c27);

scene.fog =
  new THREE.Fog(0x151c27,8,20);


const camera =
  new THREE.PerspectiveCamera(
    70,
    innerWidth / innerHeight,
    0.05,
    60
  );

camera.position.set(0,1.65,4);


const renderer =
  new THREE.WebGLRenderer({
    antialias:true
  });

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.xr.enabled = true;

renderer.shadowMap.enabled = true;

document.body.appendChild(
  renderer.domElement
);


/* =========================
   VR BUTTON
========================= */

const vrButton =
  VRButton.createButton(renderer);

vrButton.style.display = "none";

document.body.appendChild(vrButton);

document.getElementById("vr").onclick =
  () => vrButton.click();


/* =========================
   LIGHT
========================= */

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x333333,
    2
  )
);

const light =
  new THREE.DirectionalLight(
    0xffffff,
    3
  );

light.position.set(3,6,3);

light.castShadow = true;

scene.add(light);


/* =========================
   FLOOR
========================= */

const floor =
  new THREE.Mesh(
    new THREE.BoxGeometry(8,.2,8),
    new THREE.MeshStandardMaterial({
      color:0x555e68
    })
  );

floor.position.y = -.1;

floor.receiveShadow = true;

scene.add(floor);


/* =========================
   WALLS
========================= */

function wall(x,y,z,sx,sy,sz){

  const w =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        sx,sy,sz
      ),
      new THREE.MeshStandardMaterial({
        color:0x303844
      })
    );

  w.position.set(x,y,z);

  w.receiveShadow = true;

  scene.add(w);
}

wall(0,2,-4,8,4,.2);
wall(-4,2,0,.2,4,8);
wall(4,2,0,.2,4,8);


/* =========================
   BLOCKS
========================= */

const blocks = [];

const colours = [
  0xe95f5f,
  0x5b9be8,
  0x63c777,
  0xe7b94f,
  0xb46be8,
  0x4fc7c7
];

const blockSize = .55;
const half = blockSize / 2;


function createBlock(i,x,y,z){

  const block =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        blockSize,
        blockSize,
        blockSize
      ),
      new THREE.MeshStandardMaterial({
        color:colours[
          i % colours.length
        ],
        roughness:.6
      })
    );

  block.position.set(
    x,y,z
  );

  block.castShadow = true;
  block.receiveShadow = true;

  block.userData.velocity =
    new THREE.Vector3();

  block.userData.held = false;

  scene.add(block);

  blocks.push(block);
}


const positions = [
  [-1.5,.275,-1.2],
  [-.75,.275,-1.2],
  [0,.275,-1.2],
  [.75,.275,-1.2],
  [1.5,.275,-1.2],
  [-.75,.825,-1.2],
  [0,.825,-1.2]
];

positions.forEach(
  (p,i) =>
    createBlock(
      i,
      p[0],
      p[1],
      p[2]
    )
);


/* =========================
   MODE
========================= */

let mode = "hand";

const modeText =
  document.getElementById(
    "modeText"
  );

const modeButton =
  document.getElementById(
    "mode"
  );


function setMode(newMode){

  mode = newMode;

  modeText.textContent =
    mode === "hand"
      ? "HAND"
      : "POINTER";

  modeButton.textContent =
    mode === "hand"
      ? "SWITCH TO POINTER"
      : "SWITCH TO HAND";

  if(held){

    held.userData.held = false;

    held = null;

    heldController = null;
  }

  for(const c of controllers){

    c.userData.pointer.visible =
      mode === "pointer";

    c.userData.hand.visible =
      mode === "hand";
  }

  document.getElementById(
    "msg"
  ).textContent =
    mode === "hand"
      ? "HAND MODE"
      : "POINTER MODE";
}


modeButton.onclick = () => {

  setMode(
    mode === "hand"
      ? "pointer"
      : "hand"
  );

};


/* =========================
   CONTROLLERS
========================= */

const controllers = [];

let held = null;

let heldController = null;

let holdDistance = 1.2;


/* =========================
   RAYCASTER
========================= */

const raycaster =
  new THREE.Raycaster();


/* =========================
   POINTER
========================= */

function makePointer(){

  const geometry =
    new THREE.BufferGeometry();

  geometry.setFromPoints([
    new THREE.Vector3(0,0,0),
    new THREE.Vector3(0,0,-5)
  ]);

  const line =
    new THREE.Line(
      geometry,
      new THREE.LineBasicMaterial({
        color:0x00ffff
      })
    );

  line.visible = false;

  return line;
}


/* =========================
   HAND
========================= */

function makeHand(){

  const hand =
    new THREE.Group();


  const palm =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .18,.14,.22
      ),
      new THREE.MeshStandardMaterial({
        color:0xd69a78
      })
    );

  palm.position.z = -.02;

  hand.add(palm);


  const fingers = [];

  for(let i=0;i<4;i++){

    const finger =
      new THREE.Mesh(
        new THREE.CapsuleGeometry(
          .018,
          .09,
          4,
          8
        ),
        new THREE.MeshStandardMaterial({
          color:0xe2aa84
        })
      );

    finger.position.set(
      -.06 + i*.04,
      0,
      -.14
    );

    finger.rotation.x =
      Math.PI / 2;

    hand.add(finger);

    fingers.push(finger);
  }


  const thumb =
    new THREE.Mesh(
      new THREE.CapsuleGeometry(
        .02,.08,4,8
      ),
      new THREE.MeshStandardMaterial({
        color:0xe2aa84
      })
    );

  thumb.position.set(
    -.1,-.01,-.05
  );

  thumb.rotation.z = -.7;

  hand.add(thumb);


  hand.userData.fingers = fingers;
  hand.userData.thumb = thumb;

  return hand;
}


/* =========================
   HAND ANIMATION
========================= */

function animateHand(hand,grabbing){

  if(!hand) return;

  for(
    const finger of
    hand.userData.fingers
  ){

    finger.rotation.y =
      grabbing ? -.9 : 0;
  }

  hand.userData.thumb.rotation.z =
    grabbing ? -.2 : -.7;
}


/* =========================
   CREATE CONTROLLERS
========================= */

for(let i=0;i<2;i++){

  const controller =
    renderer.xr.getController(i);

  controller.userData.index = i;


  const pointer =
    makePointer();

  controller.add(pointer);

  controller.userData.pointer =
    pointer;


  const hand =
    makeHand();

  controller.add(hand);

  controller.userData.hand =
    hand;


  /* TRIGGER */

  controller.addEventListener(
    "selectstart",
    () => {

      if(mode === "pointer"){

        pointerGrab(controller);

      }
    }
  );


  controller.addEventListener(
    "selectend",
    () => {

      if(mode === "pointer"){

        pointerDrop(controller);

      }
    }
  );


  /* GRIP */

  controller.addEventListener(
    "squeezestart",
    () => {

      if(mode === "hand"){

        handGrab(controller);

      }
    }
  );


  controller.addEventListener(
    "squeezeend",
    () => {

      if(mode === "hand"){

        handThrow(controller);

      }
    }
  );


  scene.add(controller);

  controllers.push(controller);
}


/* =========================
   CONTROLLER POSITION
========================= */

function controllerPosition(c){

  return new THREE.Vector3()
    .setFromMatrixPosition(
      c.matrixWorld
    );
}


/* =========================
   CONTROLLER DIRECTION
========================= */

function controllerDirection(c){

  const q =
    c.getWorldQuaternion(
      new THREE.Quaternion()
    );

  return new THREE.Vector3(
    0,0,-1
  ).applyQuaternion(q);
}


/* =========================
   HAND GRAB
========================= */

function handGrab(controller){

  if(held) return;

  const handPosition =
    controllerPosition(
      controller
    );


  let closest = null;

  let closestDistance = .6;


  for(const block of blocks){

    if(block.userData.held)
      continue;

    const distance =
      handPosition.distanceTo(
        block.position
      );

    if(distance < closestDistance){

      closest = block;

      closestDistance =
        distance;
    }
  }


  if(!closest){

    document.getElementById(
      "msg"
    ).textContent =
      "Put your hand near a block";

    return;
  }


  held = closest;

  heldController =
    controller;

  held.userData.held = true;

  animateHand(
    controller.userData.hand,
    true
  );

  document.getElementById(
    "msg"
  ).textContent =
    "GRABBED";
}


/* =========================
   THROW
========================= */

const oldPositions = new Map();

const velocities = new Map();


function updateControllerVelocity(
  dt
){

  for(const controller of controllers){

    const position =
      controllerPosition(
        controller
      );

    const old =
      oldPositions.get(
        controller
      );

    if(old){

      const velocity =
        position.clone()
          .sub(old)
          .divideScalar(
            Math.max(dt,.001)
          );

      velocities.set(
        controller,
        velocity
      );
    }

    oldPositions.set(
      controller,
      position
    );
  }
}


function handThrow(controller){

  if(
    !held ||
    heldController !== controller
  )
    return;


  const velocity =
    velocities.get(
      controller
    ) ||
    new THREE.Vector3();


  held.userData.held = false;

  held.userData.velocity
    .copy(velocity)
    .multiplyScalar(2.2);


  held = null;

  heldController = null;

  animateHand(
    controller.userData.hand,
    false
  );

  document.getElementById(
    "msg"
  ).textContent =
    "THROWN";
}


/* =========================
   POINTER GRAB
========================= */

function pointerGrab(controller){

  if(held) return;


  const origin =
    controllerPosition(
      controller
    );

  const direction =
    controllerDirection(
      controller
    );


  raycaster.set(
    origin,
    direction
  );


  const hit =
    raycaster.intersectObjects(
      blocks,
      false
    )[0];


  if(
    !hit ||
    hit.distance > 5
  ){

    document.getElementById(
      "msg"
    ).textContent =
      "Point at a block";

    return;
  }


  held = hit.object;

  heldController =
    controller;

  held.userData.held = true;

  holdDistance =
    THREE.MathUtils.clamp(
      hit.distance,
      .7,
      4
    );


  document.getElementById(
    "msg"
  ).textContent =
    "HOLDING";
}


/* =========================
   POINTER DROP
========================= */

function pointerDrop(controller){

  if(
    !held ||
    heldController !== controller
  )
    return;


  /* NO THROW */

  held.userData.held = false;

  held.userData.velocity.set(
    0,0,0
  );


  held = null;

  heldController = null;


  document.getElementById(
    "msg"
  ).textContent =
    "DROPPED";
}


/* =========================
   POINTER RAY
========================= */

function updatePointers(){

  for(const controller of controllers){

    const pointer =
      controller.userData.pointer;


    pointer.visible =
      mode === "pointer" &&
      renderer.xr.isPresenting;


    if(!pointer.visible)
      continue;


    const origin =
      controllerPosition(
        controller
      );

    const direction =
      controllerDirection(
        controller
      );


    raycaster.set(
      origin,
      direction
    );


    const hit =
      raycaster.intersectObjects(
        blocks,
        false
      )[0];


    let length = 5;


    if(hit){

      length =
        Math.min(
          hit.distance,
          5
        );

      pointer.material.color.setHex(
        0x00ff66
      );

    }else{

      pointer.material.color.setHex(
        0x00ffff
      );
    }


    pointer.geometry.setFromPoints([
      new THREE.Vector3(0,0,0),
      new THREE.Vector3(
        0,0,-length
      )
    ]);
  }
}


/* =========================
   THUMBSTICK
========================= */

function updateJoystick(){

  if(
    mode !== "pointer" ||
    !held ||
    !heldController
  )
    return;


  const session =
    renderer.xr.getSession();

  if(!session) return;


  const wantedHand =
    heldController.userData.index === 0
      ? "left"
      : "right";


  for(
    const source of
    session.inputSources
  ){

    if(
      source.handedness !==
      wantedHand ||
      !source.gamepad
    )
      continue;
    }


    const axes =
      source.gamepad.axes;


    if(!axes || axes.length < 2)
      return;


    const y =
      axes.length >= 4
        ? axes[3]
        : axes[1];


    if(Math.abs(y) > .12){

      holdDistance +=
        y * .035;

      holdDistance =
        THREE.MathUtils.clamp(
          holdDistance,
          .7,
          4
        );
    }

    return;
}


/* =========================
   MOVE HELD BLOCK
========================= */

function updateHeld(){

  if(
    !held ||
    !heldController
  )
    return;


  const origin =
    controllerPosition(
      heldController
    );


  if(mode === "pointer"){

    const direction =
      controllerDirection(
        heldController
      );


    held.position.copy(
      origin
    );


    held.position.addScaledVector(
      direction,
      holdDistance
    );

  }else{

    /*
      HAND MODE:
      block follows the hand.
    */

    held.position.copy(
      origin
    );
  }


  held.userData.velocity.set(
    0,0,0
  );
}


/* =========================
   PHYSICS
========================= */

function physics(dt){

  for(const block of blocks){

    if(block.userData.held)
      continue;


    const v =
      block.userData.velocity;


    v.y -= 7 * dt;


    block.position.addScaledVector(
      v,
      dt
    );


    if(
      block.position.y < half
    ){

      block.position.y = half;

      if(v.y < 0)
        v.y *= -.25;

      v.x *= .92;
      v.z *= .92;
    }


    if(block.position.x < -3.7){

      block.position.x = -3.7;

      v.x *= -.4;
    }


    if(block.position.x > 3.7){

      block.position.x = 3.7;

      v.x *= -.4;
    }


    if(block.position.z < -3.7){

      block.position.z = -3.7;

      v.z *= -.4;
    }


    if(block.position.z > 3.7){

      block.position.z = 3.7;

      v.z *= -.4;
    }
  }
}


/* =========================
   DESKTOP
========================= */

let mouseHolding = false;

addEventListener(
  "pointerdown",
  event => {

    if(renderer.xr.isPresenting)
      return;


    const mouse =
      new THREE.Vector2(
        event.clientX /
          innerWidth * 2 - 1,

        -(event.clientY /
          innerHeight) * 2 + 1
      );


    raycaster.setFromCamera(
      mouse,
      camera
    );


    const hit =
      raycaster.intersectObjects(
        blocks,
        false
      )[0];


    if(hit){

      held = hit.object;

      held.userData.held = true;

      mouseHolding = true;

      document.getElementById(
        "msg"
      ).textContent =
        "HOLDING";
    }
  }
);


addEventListener(
  "pointerup",
  () => {

    if(
      mouseHolding &&
      held
    ){

      held.userData.held = false;

      held = null;

      mouseHolding = false;

      document.getElementById(
        "msg"
      ).textContent =
        "DROPPED";
    }
  }
);


/* =========================
   MOUSE LOOK
========================= */

let looking = false;

let lastX = 0;
let lastY = 0;


addEventListener(
  "pointerdown",
  event => {

    if(renderer.xr.isPresenting)
      return;

    looking = true;

    lastX = event.clientX;
    lastY = event.clientY;
  }
);


addEventListener(
  "pointermove",
  event => {

    if(
      !looking ||
      renderer.xr.isPresenting
    )
      return;


    const dx =
      event.clientX - lastX;

    const dy =
      event.clientY - lastY;


    camera.rotation.order =
      "YXZ";


    camera.rotation.y -=
      dx * .003;


    camera.rotation.x =
      THREE.MathUtils.clamp(
        camera.rotation.x -
          dy * .003,
        -1.45,
        1.45
      );


    lastX = event.clientX;
    lastY = event.clientY;
  }
);


addEventListener(
  "pointerup",
  () => {
    looking = false;
  }
);


/* =========================
   MAIN LOOP
========================= */

const clock =
  new THREE.Clock();


function animate(){

  const dt =
    Math.min(
      clock.getDelta(),
      .033
    );


  if(renderer.xr.isPresenting){

    updateControllerVelocity(dt);

    updatePointers();

    updateJoystick();

    updateHeld();


    for(
      const controller of
      controllers
    ){

      animateHand(
        controller.userData.hand,
        mode === "hand" &&
        controller ===
          heldController &&
        held !== null
      );
    }
  }


  physics(dt);


  renderer.render(
    scene,
    camera
  );
}


renderer.setAnimationLoop(
  animate
);


/* =========================
   RESIZE
========================= */

addEventListener(
  "resize",
  () => {

    camera.aspect =
      innerWidth / innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);


/* =========================
   START
========================= */

setMode("hand");

</script>

</body>
</html>
